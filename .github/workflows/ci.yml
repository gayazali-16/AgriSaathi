name: prototype-checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backend and data preparation
        run: python -m pytest --basetemp .test-tmp
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend workflow
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test browser workflow and accessibility
        env:
          DEMO_MODE: 'true'
          SESSION_SECRET: ci-playwright-test-session-secret
          GEMINI_API_KEY: ''
          OPENWEATHER_API_KEY: ''
          DATABASE_PATH: backend/data/runtime/e2e.sqlite3
          UPLOAD_DIR: backend/data/uploads/e2e
        working-directory: frontend
        run: npm run test:e2e
